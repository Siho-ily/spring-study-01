spring:
  application:
    name: til-board

  datasource:
    url: jdbc:mysql://localhost:3306/tilboard
    username: root
    password: til_board

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # JPA가 날리는 쿼리 콘솔에서 확인

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}


springdoc:
  # Swagger UI 경로 설정
  swagger-ui:
    path: /swagger-ui
    # API 목록을 그룹별로 표시
    groups-order: DESC
    # 태그를 알파벳 순으로 정렬
    tags-sorter: alpha
    # 오퍼레이션을 HTTP 메서드 순으로 정렬
    operations-sorter: method
    # Try it out 기능 기본 활성화
    disable-swagger-default-url: true
    # 요청 소요 시간 표시
    display-request-duration: true

  # OpenAPI 문서 경로
  api-docs:
    path: /v3/api-docs
    enabled: true

  # 패키지 경로 스캔 설정
  packages-to-scan: com.sihoily.tilboard

  # 기본 스프링 액추에이터 응답 제외
  show-actuator: false